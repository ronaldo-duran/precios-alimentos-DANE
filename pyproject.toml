[project]
name = "precios-alimentos-dane"
version = "0.1.0"
description = "Pronóstico de precios mayoristas de alimentos en Colombia (SIPSA-DANE)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }

dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "pyarrow>=16",
    "pyyaml>=6",
    "requests>=2.31",
]

[project.optional-dependencies]
models = [
    "lightgbm>=4.5",
    "statsforecast>=1.7",
    "scikit-learn>=1.5",
]
exogenas = [
    # Festivos colombianos, incluida la Ley Emiliani (traslado al lunes).
    # El calendario cambia por ley: en 2026 Colombia pasó de 18 a 19 festivos.
    "holidays>=0.60",
]
app = [
    "streamlit>=1.36",
    "plotly>=5.22",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/precios"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
